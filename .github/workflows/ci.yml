name: CI

on:
    push:
        branches: [main, dev]
    pull_request:

jobs:
    backend:
        name: Backend
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: server

        env:
            DATABASE_URL: "file:./dev.db"

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: server/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Generate Prisma client
              run: npx prisma generate

            - name: Typecheck
              run: npm run typecheck

            - name: Build
              run: npm run build

            - name: Vitest
              run: npm run test

    frontend:
        name: Frontend
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: client

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: client/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

            - name: Lint
              run: npm run lint

            - name: Build
              run: npm run build
